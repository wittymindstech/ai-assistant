apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-assistant-ingress
  namespace: ai-assistant
  annotations:
    # Cloud-specific annotations will be added in cloud-specific files
    kubernetes.io/ingress.class: "nginx"  # Or cloud-specific ingress controller
spec:
  rules:
  - host: your-domain.com  # Replace with your domain
    http:
      paths:
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: ai-assistant-service
            port:
              number: 8001
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ecommerce-frontend-service
            port:
              number: 4000