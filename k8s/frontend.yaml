apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce-frontend
  namespace: ai-assistant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-frontend
  template:
    metadata:
      labels:
        app: ecommerce-frontend
    spec:
      containers:
      - name: ecommerce-frontend
        image: your-registry/ecommerce-frontend:latest  # Replace with your container registry
        ports:
        - containerPort: 4000
        env:
        - name: API_BASE_URL
          valueFrom:
            configMapKeyRef:
              name: ai-assistant-config
              key: API_BASE_URL
        livenessProbe:
          httpGet:
            path: /
            port: 4000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-frontend-service
  namespace: ai-assistant
spec:
  selector:
    app: ecommerce-frontend
  ports:
  - port: 4000
    targetPort: 4000
  type: ClusterIP